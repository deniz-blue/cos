name: Build & release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Android artifacts in Docker
        run: |
          docker build -f docker/Dockerfile -t cos-builder .
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v cos-gradle-cache:/root/.gradle \
            cos-builder

      - uses: actions/upload-artifact@v4
        with:
          name: cos-android-artifacts
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
